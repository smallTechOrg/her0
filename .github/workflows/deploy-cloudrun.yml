# Deploys #hero to Cloud Run on every push to the deploy branch (and by hand with "Run workflow").
# Repository secrets: GCP_PROJECT, GCP_REGION, GCP_BUCKET, GCP_SQL_INSTANCE and either GCP_WORKLOAD_IDENTITY_PROVIDER +
# GCP_SERVICE_ACCOUNT (keyless, preferred) or GCP_SA_KEY (a service-account JSON key). The app's own secrets live in
# Secret Manager (see deploy/cloudrun.sh), never in GitHub.
name: deploy-cloud-run
on:
  push:
    branches: [main, feature/hero-20261029-1915-v0.1]
    paths-ignore: ["docs/**", "spec/**", "*.md"]
  workflow_dispatch: {}
concurrency: { group: cloud-run, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and deploy
        env:
          PROJECT: ${{ secrets.GCP_PROJECT }}
          REGION: ${{ secrets.GCP_REGION }}
          BUCKET: ${{ secrets.GCP_BUCKET }}
          SQL_INSTANCE: ${{ secrets.GCP_SQL_INSTANCE }}
        run: ./deploy/cloudrun.sh
