[project]
name = "hero"
version = "0.1.0"
description = "#hero - a mobile-browser endless runner on a real stretch of street."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pillow>=10.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "pygltflib==1.16.5",
    "numpy>=2.5.4",
]

[project.scripts]
hero-serve = "hero.main:serve"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "playwright>=1.47",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
addopts = "-p no:cacheprovider --tb=short"
markers = [
    "live: needs the network and real API keys; skipped unless `-m live` is given or the invocation path includes tests/live (see tests/conftest.py)",
    "validator: runs the external Khronos glTF validator via npx (needs node + network); skipped with a visible reason when unavailable",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F811", "F841", "E741"]
