<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>#hero — play</title>
  <link rel="stylesheet" href="/css/base.css?v=3">
  <link rel="stylesheet" href="/css/game.css?v=5">
  <script type="importmap">{"imports": {"three": "/vendor/three.module.js"}}</script>
</head>
<body>
  <main id="app" data-hero-page="play" class="play">
    <canvas id="game" aria-label="Street run" role="img"></canvas>

    <div id="hud" hidden aria-live="off">
      <div class="hud-item distance"><span class="hud-label">Distance</span><span class="hud-value"><span id="hud-distance">0</span> m</span></div>
      <div class="hud-item score"><span class="hud-label">Score</span><span class="hud-value" id="hud-score">0</span></div>
      <div class="hud-item tokens"><span class="hud-label">Tokens</span><span class="hud-value" id="hud-tokens">0</span></div>
      <div class="hud-item health"><span class="hud-label">Health <span id="hud-health">100</span></span><span class="hud-bar"><span id="hud-health-bar" data-level="ok"></span></span></div>
      <div id="hud-lane">footpath</div>
      <button type="button" id="hud-about" data-testid="hud-about" class="hud-pause" aria-label="Pause and show About this street" title="Pause · About this street">&#10074;&#10074;</button>
    </div>
    <div id="flash" aria-hidden="true"></div>
    <div id="toast" data-testid="hit-toast" role="status" aria-live="polite"></div>

    <section id="panel-loading" class="panel" aria-busy="true">
      <h2 id="loading-name">Loading street…</h2>
      <p class="muted">Loading the street model…</p>
      <p class="muted" id="loading-progress">Fetching scene…</p>
    </section>

    <section id="panel-error" class="panel" hidden>
      <h2>Couldn't load this street</h2>
      <p class="error" id="error-reason"></p>
      <div class="btn-row">
        <button type="button" id="error-retry" data-testid="error-retry">Retry</button>
        <a class="btn-secondary" href="/">Back to gallery</a>
      </div>
    </section>

    <section id="panel-ready" class="panel" hidden>
      <h2 id="ready-name"></h2>
      <p class="muted">Lanes: footpath · road edge · road</p>
      <p class="model-badge" id="model-badge" data-testid="model-badge"></p>
      <ul class="hints">
        <li><b>⇠ ⇢</b> swipe: lane</li><li><b>⇡</b> swipe up: jump</li>
        <li><b>⇣</b> swipe down: slide</li><li><b>⌨</b> desktop: arrow keys</li>
      </ul>
      <button type="button" id="start" disabled>Tap to run</button>
      <button type="button" id="about-open" data-testid="about-open" class="btn-secondary">About this street</button>
    </section>

    <section id="about-panel" data-testid="about-panel" class="panel about" hidden></section>

    <section id="results" class="panel results" hidden aria-label="Run results"></section>
  </main>
  <script type="module" src="/js/game/main.js?v=6"></script>
</body>
</html>
